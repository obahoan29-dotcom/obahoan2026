<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CÁC THẺ META ÉP TRÌNH DUYỆT KHÔNG LƯU CACHE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Cổng Thông Tin Đề Thi Trực Tuyến</title>
    <!-- Font chữ Plus Jakarta Sans hiện đại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0284c7;
            --primary-blue-dark: #0369a1;
            --primary-red: #e11d48;
            --primary-red-dark: #be123c;
            --accent-orange: #f97316;
            --accent-green: #10b981;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --dantri-green: #059669;
            --dantri-hover: #ecfdf5;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            font-size: 17px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 10px 12px;
        }

        /* BANNER ĐẦU TRANG CAO CẤP */
        .top-banner-box {
            width: 100%;
            height: 185px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: var(--shadow-lg);
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 2px solid rgba(255, 215, 0, 0.5);
            position: relative;
        }

        .top-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: brightness(1.2) contrast(1.05);
        }

        .top-banner-box:hover .top-banner-img {
            transform: scale(1.03);
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15,23,42,0.15) 0%, rgba(15,23,42,0.35) 100%);
            pointer-events: none;
        }

        .banner-avatar {
            position: absolute;
            top: 14px;
            left: 16px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.95), 0 4px 10px rgba(0,0,0,0.3);
            z-index: 2;
            filter: brightness(1.2) contrast(1.05);
            animation: pulseAvatar 3s ease-in-out infinite;
        }

        @keyframes pulseAvatar {
            0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(255,255,255,0.7); }
            50% { transform: scale(1.06); box-shadow: 0 0 24px rgba(255,255,255,1); }
        }

        .banner-title {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 11.5px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8), 0 0 12px rgba(2, 132, 199, 0.6);
            letter-spacing: 0.6px;
            white-space: nowrap;
            pointer-events: none;
            text-align: center;
            background: rgba(15, 23, 42, 0.55);
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.25);
        }

        .banner-rocket {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 30px;
            animation: flyRocket 4s ease-in-out infinite;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        @keyframes flyRocket {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-10px) rotate(-12deg) scale(1.15); }
        }

        .banner-watermark {
            position: absolute;
            bottom: 12px;
            left: 18px;
            z-index: 2;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            user-select: none;
        }

        .section-header-title {
            font-size: 14.5px;
            font-weight: 800;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 4px;
        }
        .section-header-title.red-title {
            color: var(--primary-red);
        }
        .section-header-title.blue-title {
            color: var(--primary-blue-dark);
        }

        .dantri-nav-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid #cbd5e1;
            margin-bottom: 10px;
            overflow: hidden;
            width: 100%;
        }

        .dantri-scroll-bar {
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            padding: 4px 6px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border-bottom: 1px solid #e2e8f0;
        }
        .dantri-scroll-bar::-webkit-scrollbar {
            height: 3px;
        }
        .dantri-scroll-bar::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        .dantri-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 18px;
            font-size: 15.5px;
            font-weight: 700;
            color: #334155;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            flex-shrink: 0;
            border-radius: 6px 6px 0 0;
            margin-right: 2px;
        }

        /* TỐI ƯU CỘT CHỮ VÀ CỠ CHỮ CHO DÒNG BẢN TIN DƯỚI BANNER */
        #dantri-nav-bar .dantri-nav-btn {
            padding: 5px 7px;
            font-size: 12px;
            line-height: 1.15;
            text-align: center;
            gap: 3px;
        }

        #daythem-nav-bar .dantri-nav-btn,
        #chinhkhoa-nav-bar .dantri-nav-btn {
            font-size: 18px;
            font-weight: 800;
            padding: 12px 22px;
        }

        .dantri-nav-btn:hover {
            color: var(--dantri-green);
            background-color: var(--dantri-hover);
            transform: translateY(-1px);
        }

        .dantri-nav-btn.active {
            color: #047857;
            border-bottom: 3px solid #059669;
            background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 100%);
            box-shadow: inset 0 -2px 0 #059669;
            font-weight: 800;
        }

        .dantri-nav-btn .caret-icon {
            font-size: 10px;
            transition: transform 0.25s ease;
            color: #64748b;
        }

        .dantri-nav-btn.active .caret-icon {
            transform: rotate(180deg);
            color: #047857;
        }

        .dantri-dropdown-panel {
            display: none;
            padding: 12px 14px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            width: 100%;
            box-sizing: border-box;
            animation: expandDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dantri-dropdown-panel.show {
            display: block;
        }

        @keyframes expandDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dantri-sub-header {
            font-size: 13.5px;
            font-weight: 800;
            color: #047857;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .reminder-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid #cbd5e1;
            border-left: 5px solid var(--primary-red);
            margin-bottom: 10px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #ffffff 0%, #fff1f2 100%);
        }

        .reminder-header-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-red);
            margin: 0 0 8px 0;
            border-bottom: 2px solid #fecdd3;
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .folder-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid #cbd5e1;
            margin-bottom: 10px;
            transition: all 0.25s ease;
        }
        .folder-section:hover {
            box-shadow: var(--shadow-lg);
            border-color: #94a3b8;
        }

        .folder-header {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            list-style: none;
            user-select: none;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            transition: background 0.2s;
        }
        .folder-header::-webkit-details-marker {
            display: none;
        }
        .folder-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            box-shadow: var(--shadow-sm);
        }
        .folder-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-blue-dark);
            flex: 1;
            margin: 0;
            letter-spacing: 0.3px;
        }
        .folder-arrow {
            font-size: 12px;
            color: #64748b;
            transition: transform 0.3s ease;
            font-weight: bold;
        }
        details[open] .folder-arrow {
            transform: rotate(90deg);
            color: var(--primary-blue);
        }

        .link-list {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
            width: 100%;
            box-sizing: border-box;
        }

        .exam-card {
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .exam-card:hover {
            border-color: var(--primary-blue);
            background: #f0f9ff;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .exam-card:active {
            transform: scale(0.99);
        }

        .exam-thumb-box {
            width: 40px;  
            height: 50px; 
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #cbd5e1;
            background: #f1f5f9;
            box-shadow: var(--shadow-sm);
        }

        .exam-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .exam-info {
            flex: 1;
            min-width: 0;
        }

        .exam-title {
            font-weight: 700;
            font-size: 14.5px;
            color: #0f172a;
            margin-bottom: 2px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .exam-date {
            font-size: 11.5px;
            color: var(--text-sub);
            font-weight: 500;
        }
        
        .load-more-btn {
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            border: 1px dashed #94a3b8;
            color: var(--primary-blue-dark);
            font-size: 13px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
            transition: all 0.2s ease;
            width: 100%;
            box-shadow: var(--shadow-sm);
        }
        .load-more-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
            border-color: #64748b;
        }

        .hidden-links-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }

        .badge-hot {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            margin-right: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.4);
            display: inline-block;
            vertical-align: middle;
        }

        .badge-gdrive {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            margin-right: 6px;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
            display: inline-block;
            vertical-align: middle;
        }

        .badge-onedrive {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            margin-right: 6px;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
            display: inline-block;
            vertical-align: middle;
        }

        .arrow {
            font-size: 16px;
            color: #94a3b8;
            margin-left: auto;
            font-weight: bold;
            transition: color 0.2s, transform 0.2s;
        }
        .exam-card:hover .arrow {
            color: var(--primary-blue);
            transform: translateX(3px);
        }

        .empty-folder {
            padding: 12px;
            color: #64748b;
            font-style: italic;
            font-size: 13.5px;
            text-align: center;
        }

        .news-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid #cbd5e1;
            margin-top: 10px;
            padding: 14px 16px;
        }

        .news-header-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary-blue-dark);
            margin: 0 0 10px 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .news-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 8px;
            border-bottom: 1px solid #f1f5f9;
            text-decoration: none;
            color: var(--text-main);
            border-radius: 8px;
            transition: background 0.2s, transform 0.2s;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-item:hover {
            background-color: #f8fafc;
            transform: translateX(2px);
        }

        .news-item:hover .news-title {
            color: var(--primary-blue);
        }

        .news-content {
            flex: 1;
        }

        .news-title {
            font-weight: 700;
            font-size: 14.5px;
            color: #1e293b;
            margin-bottom: 3px;
            line-height: 1.4;
        }

        .news-date {
            font-size: 11.5px;
            color: var(--text-sub);
        }

        .news-img-box {
            width: 96px;
            height: 64px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #cbd5e1;
            background: #f1f5f9;
            box-shadow: var(--shadow-sm);
        }

        .news-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .news-item:hover .news-img {
            transform: scale(1.05);
        }

        .news-empty {
            padding: 12px;
            color: #64748b;
            font-style: italic;
            font-size: 13.5px;
            text-align: center;
        }

        .bottom-banner-box {
            width: 100%;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 12px;
            box-shadow: var(--shadow-md);
            background: #cbd5e1;
            border: 1px solid #94a3b8;
        }

        .bottom-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        footer {
            text-align: center;
            margin-top: 10px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 800;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            letter-spacing: 0.8px;
            border: 1px solid rgba(255,255,255,0.25);
        }

        @media (max-width: 640px) {
            body {
                font-size: 16px;
            }
            .banner-title {
                font-size: 11px;
                padding: 4px 10px;
            }
            .banner-watermark {
                font-size: 18px;
            }
            .dantri-nav-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
            #dantri-nav-bar .dantri-nav-btn {
                padding: 4px 5px;
                font-size: 11px;
            }
            #daythem-nav-bar .dantri-nav-btn,
            #chinhkhoa-nav-bar .dantri-nav-btn {
                font-size: 16px;
                padding: 10px 16px;
            }
            .news-img-box {
                width: 80px;
                height: 54px;
            }
            .exam-thumb-box {
                width: 36px;
                height: 46px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- BANNER ĐẦU TRANG -->
    <div class="top-banner-box">
        <img id="top-banner-img" class="top-banner-img" src="" alt="Banner Top Tom & Jerry">
        <div class="banner-overlay"></div>
        <img id="web-avatar-img" class="banner-avatar" src="" alt="Avatar Web">
        <div class="banner-title">Kho Đề Thi & Tài Liệu Trực Tuyến</div>
        <div class="banner-rocket">🚀</div>
        <div class="banner-watermark">OBAWAN</div>
    </div>

    <!-- THANH MENU BẢN TIN / THỜI SỰ GIÁO DỤC -->
    <div class="dantri-nav-container">
        <div class="dantri-scroll-bar" id="dantri-nav-bar"></div>
        <div class="dantri-dropdown-panel" id="dantri-dropdown-panel">
            <div class="dantri-sub-header" id="dantri-sub-title">📌 TIN TỨC NỔI BẬT</div>
            <div id="dantri-news-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>

    <!-- KHỐI NHẮC NHỞ QUAN TRỌNG -->
    <div class="reminder-section">
        <h3 class="reminder-header-title">📌 Nhắc Nhở Quan Trọng</h3>
        <div id="reminder-container"></div>
    </div>

    <!-- DÒNG TIÊU ĐỀ & THANH NGANG CÁC LỚP DẠY THÊM -->
    <div class="section-header-title red-title">🔴 Các lớp dạy thêm</div>
    <div class="dantri-nav-container">
        <div class="dantri-scroll-bar" id="daythem-nav-bar"></div>
        <div class="dantri-dropdown-panel" id="daythem-dropdown-panel">
            <div class="link-list" id="daythem-links-container"></div>
        </div>
    </div>

    <!-- DÒNG TIÊU ĐỀ & THANH NGANG CÁC LỚP CHÍNH KHÓA -->
    <div class="section-header-title blue-title">🔵 Các lớp chính khóa</div>
    <div class="dantri-nav-container">
        <div class="dantri-scroll-bar" id="chinhkhoa-nav-bar"></div>
        <div class="dantri-dropdown-panel" id="chinhkhoa-dropdown-panel">
            <div class="link-list" id="chinhkhoa-links-container"></div>
        </div>
    </div>

    <!-- KHO TÀI LIỆU PDF, WORD, ẢNH... -->
    <div id="kho-tai-lieu-container"></div>

    <!-- BẢNG TIN VÀ DẶN DÒ TỪ THẦY GIÁO -->
    <div class="news-section">
        <h3 class="news-header-title">📋 Bảng Tin & Dặn Dò Từ Thầy Giáo</h3>
        <div id="news-container"></div>
    </div>

    <!-- BANNER CHÂN TRANG & FOOTER -->
    <div class="bottom-banner-box">
        <img id="bottom-banner-img" class="bottom-banner-img" src="" alt="Banner Bottom">
    </div>

    <footer>
        Copyright &copy; 2026 Phạm Công Hoan
    </footer>
</div>

<script>
    const TOP_BANNER_URL = "https://files.catbox.moe/cf5o9u.jpg"; 
    const WEB_AVATAR_URL = "https://images.unsplash.com/photo-1509062522246-3755977927d7?w=150";

    function createExamCard(item) {
        let card = document.createElement("a");
        card.href = item.url;
        card.className = "exam-card";
        card.target = "_blank";

        let hotBadge = item.isHot ? `<span class="badge-hot">HOT</span>` : '';
        let platformBadge = '';
        if (item.platform === 'gdrive') {
            platformBadge = `<span class="badge-gdrive">Drive</span>`;
        } else if (item.platform === 'onedrive') {
            platformBadge = `<span class="badge-onedrive">OneDrive</span>`;
        }

        let thumbHtml = item.avatar ? `<div class="exam-thumb-box"><img src="${item.avatar}" class="exam-thumb" alt="Thumbnail"></div>` : '';

        card.innerHTML = `
            ${thumbHtml}
            <div class="exam-info">
                <div class="exam-title" title="${item.title}">${hotBadge}${platformBadge}${item.title}</div>
                <div class="exam-date">🕒 ${item.date}</div>
            </div>
            <div class="arrow">&#8250;</div>
        `;
        return card;
    }

    function renderLinkListToContainer(linksArray, containerElement) {
        containerElement.innerHTML = "";
        if (!linksArray || linksArray.length === 0) {
            containerElement.innerHTML = `<div class="empty-folder">Chưa có bài tập nào trong mục này...</div>`;
            return;
        }

        const maxVisible = 2;
        const visibleLinks = linksArray.slice(0, maxVisible);
        const hiddenLinks = linksArray.slice(maxVisible);

        visibleLinks.forEach(item => {
            containerElement.appendChild(createExamCard(item));
        });

        if (hiddenLinks.length > 0) {
            let hiddenContainer = document.createElement("div");
            hiddenContainer.className = "hidden-links-container";
            hiddenContainer.style.display = "none";

            hiddenLinks.forEach(item => {
                hiddenContainer.appendChild(createExamCard(item));
            });

            let toggleBtn = document.createElement("button");
            toggleBtn.className = "load-more-btn";
            toggleBtn.innerHTML = `⬇ Xem thêm ${hiddenLinks.length} bài cũ hơn...`;
            
            toggleBtn.onclick = function(e) {
                e.stopPropagation(); 
                if (hiddenContainer.style.display === "none") {
                    hiddenContainer.style.display = "flex";
                    toggleBtn.innerHTML = `⬆ Thu gọn bớt`;
                } else {
                    hiddenContainer.style.display = "none";
                    toggleBtn.innerHTML = `⬇ Xem thêm ${hiddenLinks.length} bài cũ hơn...`;
                }
            };

            containerElement.appendChild(toggleBtn);
            containerElement.appendChild(hiddenContainer);
        }
    }

    let activeDanTriId = null;
    let activeDayThemId = null;
    let activeChinhKhoaId = null;

    function renderDanTriNavBar() {
        const navBar = document.getElementById("dantri-nav-bar");
        navBar.innerHTML = "";

        DANTRI_NAV_CATEGORIES.forEach(cat => {
            let btn = document.createElement("button");
            btn.className = "dantri-nav-btn";
            btn.innerHTML = `<div style="display:inline-flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">${cat.title}</div><span class="caret-icon">&#9660;</span>`;
            
            btn.onclick = function() {
                const panel = document.getElementById("dantri-dropdown-panel");
                const subTitle = document.getElementById("dantri-sub-title");
                const newsList = document.getElementById("dantri-news-list");

                navBar.querySelectorAll(".dantri-nav-btn").forEach(b => b.classList.remove("active"));

                if (activeDanTriId === cat.id) {
                    panel.classList.remove("show");
                    activeDanTriId = null;
                } else {
                    activeDanTriId = cat.id;
                    btn.classList.add("active");
                    subTitle.innerHTML = cat.subTitle;
                    newsList.innerHTML = "";

                    cat.news.forEach(item => {
                        let card = document.createElement("a");
                        card.href = item.url;
                        card.className = "dantri-news-card";
                        card.target = "_blank";
                        card.style.cssText = "display:flex; align-items:flex-start; gap:10px; padding:8px 12px; background:#fff; border-radius:8px; border:1px solid #cbd5e1; text-decoration:none; color:inherit; box-shadow:0 2px 5px rgba(0,0,0,0.03); transition:all 0.2s;";
                        
                        let tagBg = item.tag === "GIẢI TRÍ" || item.tag === "CƯỜI MẮT" || item.tag === "MEME MATH" ? "background:#fef3c7; color:#b45309;" : "background:#dcfce7; color:#15803d;";

                        card.innerHTML = `
                            <span style="font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; ${tagBg} white-space:nowrap; margin-top:2px;">${item.tag}</span>
                            <div style="flex:1; min-width:0;">
                                <div style="font-size:13px; font-weight:700; color:#0f172a; line-height:1.4; margin-bottom:2px;">${item.title}</div>
                                <div style="font-size:11px; color:#64748b; font-weight:500;">🕒 ${item.date}</div>
                            </div>
                        `;
                        newsList.appendChild(card);
                    });

                    panel.classList.add("show");
                    btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            };
            navBar.appendChild(btn);
        });
    }

    function renderDayThemNavBar() {
        const navBar = document.getElementById("daythem-nav-bar");
        const panel = document.getElementById("daythem-dropdown-panel");
        const container = document.getElementById("daythem-links-container");
        navBar.innerHTML = "";

        DAY_THEM_CATEGORIES.forEach(cat => {
            let btn = document.createElement("button");
            btn.className = "dantri-nav-btn";
            btn.innerHTML = `${cat.title} <span class="caret-icon">&#9660;</span>`;

            btn.onclick = function() {
                navBar.querySelectorAll(".dantri-nav-btn").forEach(b => b.classList.remove("active"));

                if (activeDayThemId === cat.id) {
                    panel.classList.remove("show");
                    activeDayThemId = null;
                } else {
                    activeDayThemId = cat.id;
                    btn.classList.add("active");
                    renderLinkListToContainer(cat.links, container);
                    panel.classList.add("show");
                    btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            };
            navBar.appendChild(btn);
        });
    }

    function renderKhoTaiLieu() {
        const container = document.getElementById("kho-tai-lieu-container");
        container.innerHTML = "";

        let details = document.createElement("details");
        details.className = "folder-section";

        let summary = document.createElement("summary");
        summary.className = "folder-header";
        summary.innerHTML = `
            <img src="${KHO_TAI_LIEU_FOLDER.folderAvatar}" class="folder-avatar" alt="Folder Icon">
            <h2 class="folder-title">${KHO_TAI_LIEU_FOLDER.folderName}</h2>
            <span class="folder-arrow">&#9658;</span>
        `;
        details.appendChild(summary);

        let listDiv = document.createElement("div");
        listDiv.className = "link-list";
        renderLinkListToContainer(KHO_TAI_LIEU_FOLDER.links, listDiv);

        details.appendChild(listDiv);
        container.appendChild(details);
    }

    function renderReminderSection() {
        const container = document.getElementById("reminder-container");
        container.innerHTML = "";

        TOP_REMINDER_DATA.forEach(item => {
            let reminderCard = document.createElement("a");
            reminderCard.href = item.url;
            reminderCard.className = "news-item";
            reminderCard.target = "_blank";

            let imgHtml = item.image ? `<div class="news-img-box"><img src="${item.image}" class="news-img" alt="Illustration"></div>` : '';

            reminderCard.innerHTML = `
                <div class="news-content">
                    <div class="news-title">${item.title}</div>
                    <div class="news-date">🕒 ${item.date}</div>
                </div>
                ${imgHtml}
            `;
            container.appendChild(reminderCard);
        });
    }

    function renderNewsSection() {
        const container = document.getElementById("news-container");
        container.innerHTML = "";

        NEWS_DATA.forEach(item => {
            if (item.isEmpty) {
                let emptyDiv = document.createElement("div");
                emptyDiv.className = "news-empty";
                emptyDiv.innerHTML = `📝 ${item.title}`;
                container.appendChild(emptyDiv);
            } else {
                let newsCard = document.createElement("a");
                newsCard.href = item.url;
                newsCard.className = "news-item";
                newsCard.target = "_blank";

                let imgHtml = item.image ? `<div class="news-img-box"><img src="${item.image}" class="news-img" alt="Illustration"></div>` : '';

                newsCard.innerHTML = `
                    <div class="news-content">
                        <div class="news-title">${item.title}</div>
                        <div class="news-date">🕒 ${item.date}</div>
                    </div>
                    ${imgHtml}
                `;
                container.appendChild(newsCard);
            }
        });
    }

    window.onload = function() {
        document.getElementById("top-banner-img").src = TOP_BANNER_URL;
        document.getElementById("web-avatar-img").src = WEB_AVATAR_URL;
        document.getElementById("bottom-banner-img").src = BOTTOM_BANNER_URL;

        renderDanTriNavBar();
        renderReminderSection();
        renderDayThemNavBar();
        renderChinhKhoaNavBar();
        renderKhoTaiLieu();
        renderNewsSection();
    }
</script>

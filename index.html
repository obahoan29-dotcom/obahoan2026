<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CÁC THẺ META ÉP TRÌNH DUYỆT KHÔNG LƯU CACHE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Cổng Thông Tin Đề Thi Trực Tuyến</title>
    <style>
        :root {
            --primary-blue: #0056b3;
            --primary-red: #d63031;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --accent: #ff4757;
            --dantri-green: #008844;
            --dantri-hover: #e8f5e9;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px;
        }

        /* BANNER ĐẦU TRANG */
        .top-banner-box {
            width: 100%;
            height: 170px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            background: #1e293b;
            border: 2px solid rgba(255, 215, 0, 0.4);
            position: relative;
        }
        .top-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .top-banner-box:hover .top-banner-img {
            transform: scale(1.02);
        }

        .banner-avatar {
            position: absolute;
            top: 10px;
            left: 12px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            z-index: 2;
            animation: pulseAvatar 3s ease-in-out infinite;
        }
        @keyframes pulseAvatar {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.9); }
        }

        .banner-title {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 18px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: none;
            text-align: center;
        }

        .banner-rocket {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 26px;
            animation: flyRocket 4s ease-in-out infinite;
            z-index: 2;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
        }
        @keyframes flyRocket {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-8px) rotate(-10deg) scale(1.1); }
        }

        .banner-watermark {
            position: absolute;
            bottom: 8px;
            left: 14px;
            z-index: 2;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.35);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            user-select: none;
        }

        /* KHỐI TIÊU ĐỀ PHÂN MỤC */
        .section-header-title {
            font-size: 15px;
            font-weight: 800;
            margin: 18px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-header-title.red-title {
            color: var(--primary-red);
        }
        .section-header-title.blue-title {
            color: var(--primary-blue);
        }

        /* THANH MENU TRƯỢT NGANG FULL WIDTH */
        .dantri-nav-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            margin-bottom: 15px;
            overflow: hidden;
            width: 100%;
        }
        .dantri-scroll-bar {
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            padding: 4px 8px;
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
        }
        .dantri-scroll-bar::-webkit-scrollbar {
            height: 4px;
        }
        .dantri-scroll-bar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dantri-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }
        .dantri-nav-btn:hover {
            color: var(--dantri-green);
            background-color: var(--dantri-hover);
            border-radius: 6px 6px 0 0;
        }
        .dantri-nav-btn.active {
            color: var(--dantri-green);
            border-bottom-color: var(--dantri-green);
            background-color: #f0fdf4;
            border-radius: 6px 6px 0 0;
        }
        .dantri-nav-btn .caret-icon {
            font-size: 10px;
            transition: transform 0.2s ease;
            color: #64748b;
        }
        .dantri-nav-btn.active .caret-icon {
            transform: rotate(180deg);
            color: var(--dantri-green);
        }

        /* BẢNG NỘI DUNG SỔ RA KHỦNG TỰ ĐỘNG TRÀN HẾT MÀN HÌNH */
        .dantri-dropdown-panel {
            display: none;
            padding: 14px 16px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            width: 100%;
            box-sizing: border-box;
            animation: expandDown 0.25s ease-out;
        }
        .dantri-dropdown-panel.show {
            display: block;
        }
        @keyframes expandDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dantri-sub-header {
            font-size: 12px;
            font-weight: 700;
            color: #047857;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* KHU VỰC NHẮC NHỞ */
        .reminder-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            margin-bottom: 15px;
            padding: 12px 18px;
        }
        .reminder-header-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-red);
            margin: 0 0 10px 0;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 6px;
        }

        /* FOLDER THƯ MỤC KHU VỰC TÀI LIỆU */
        .folder-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            margin-bottom: 15px;
            transition: all 0.25s ease;
        }
        .folder-section:hover {
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .folder-header {
            padding: 11px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            list-style: none;
            user-select: none;
            background: linear-gradient(to right, #f0f4f8, #e2e8f0);
            transition: background 0.2s;
        }
        .folder-header::-webkit-details-marker {
            display: none;
        }
        .folder-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .folder-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-blue);
            flex: 1;
            margin: 0;
        }
        .folder-arrow {
            font-size: 11px;
            color: #718096;
            transition: transform 0.3s;
        }
        details[open] .folder-arrow {
            transform: rotate(90deg);
        }

        /* DANH SÁCH THẺ BÀI TẬP / LIÊN KẾT */
        .link-list {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            width: 100%;
            box-sizing: border-box;
        }
        .exam-card {
            background: #fdfdfd;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #edf2f7;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .exam-card:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
            transform: translateY(-1px);
        }
        .exam-card:active {
            transform: scale(0.99);
        }
        .exam-thumb-box {
            width: 38px;  
            height: 50px; 
            border-radius: 5px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
        }
        .exam-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .exam-info {
            flex: 1;
            min-width: 0;
        }
        .exam-title {
            font-weight: 600;
            font-size: 12px; 
            color: #1a202c;
            margin-bottom: 3px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .exam-date {
            font-size: 10px;
            color: #718096;
        }
        
        .load-more-btn {
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
            color: var(--primary-blue);
            font-size: 11px;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
            transition: all 0.2s;
            width: 100%;
        }
        .load-more-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }
        .hidden-links-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }

        .badge-hot {
            background: var(--accent);
            color: white;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 4px;
        }
        .badge-gdrive {
            background: #10b981;
            color: white;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 4px;
        }
        .badge-onedrive {
            background: #0284c7;
            color: white;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 4px;
        }

        .arrow {
            font-size: 14px;
            color: #a0aec0;
            margin-left: auto;
        }
        .empty-folder {
            padding: 12px;
            color: #a0aec0;
            font-style: italic;
            font-size: 12px;
            text-align: center;
        }

        /* BẢNG TIN */
        .news-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            margin-top: 15px;
            padding: 15px 18px;
        }
        .news-header-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--primary-blue);
            margin: 0 0 12px 0;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }
        .news-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
            text-decoration: none;
            color: var(--text);
            transition: background 0.2s;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-item:hover .news-title {
            color: var(--primary-blue);
        }
        .news-content {
            flex: 1;
        }
        .news-title {
            font-weight: 600;
            font-size: 13px;
            color: #1a202c;
            margin-bottom: 3px;
            line-height: 1.4;
        }
        .news-date {
            font-size: 10px;
            color: #718096;
        }
        .news-img-box {
            width: 100px;
            height: 65px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
        }
        .news-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .news-empty {
            padding: 10px;
            color: #a0aec0;
            font-style: italic;
            font-size: 12px;
            text-align: center;
        }

        /* CHÂN TRANG */
        .bottom-banner-box {
            width: 100%;
            height: 90px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            background: #e2e8f0;
        }
        .bottom-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 22px 15px;
            background-color: var(--primary-red);
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(214, 48, 49, 0.35);
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            .banner-title {
                font-size: 13px;
            }
        }
    </style>
</head>

    // HÀM TẠO THẺ BÀI TẬP / LIÊN KẾT
    function createExamCard(item) {
        let card = document.createElement("a");
        card.href = item.url;
        card.className = "exam-card";
        card.target = "_blank";

        let hotBadge = item.isHot ? `<span class="badge-hot">HOT</span>` : '';
        let platformBadge = '';
        if (item.platform === 'gdrive') {
            platformBadge = `<span class="badge-gdrive">Drive</span>`;
        } else if (item.platform === 'onedrive') {
            platformBadge = `<span class="badge-onedrive">OneDrive</span>`;
        }

        let thumbHtml = item.avatar ? `<div class="exam-thumb-box"><img src="${item.avatar}" class="exam-thumb" alt="Thumbnail"></div>` : '';

        card.innerHTML = `
            ${thumbHtml}
            <div class="exam-info">
                <div class="exam-title" title="${item.title}">${hotBadge}${platformBadge}${item.title}</div>
                <div class="exam-date">🕒 ${item.date}</div>
            </div>
            <div class="arrow">&#8250;</div>
        `;
        return card;
    }

    // HÀM ĐIỀN NỘI DUNG VÀO BẢNG SỔ RA
    function renderLinkListToContainer(linksArray, containerElement) {
        containerElement.innerHTML = "";
        if (!linksArray || linksArray.length === 0) {
            containerElement.innerHTML = `<div class="empty-folder">Chưa có bài tập nào trong mục này...</div>`;
            return;
        }

        const maxVisible = 2;
        const visibleLinks = linksArray.slice(0, maxVisible);
        const hiddenLinks = linksArray.slice(maxVisible);

        visibleLinks.forEach(item => {
            containerElement.appendChild(createExamCard(item));
        });

        if (hiddenLinks.length > 0) {
            let hiddenContainer = document.createElement("div");
            hiddenContainer.className = "hidden-links-container";
            hiddenContainer.style.display = "none";

            hiddenLinks.forEach(item => {
                hiddenContainer.appendChild(createExamCard(item));
            });

            let toggleBtn = document.createElement("button");
            toggleBtn.className = "load-more-btn";
            toggleBtn.innerHTML = `⬇ Xem thêm ${hiddenLinks.length} bài cũ hơn...`;
            
            toggleBtn.onclick = function(e) {
                e.stopPropagation(); 
                if (hiddenContainer.style.display === "none") {
                    hiddenContainer.style.display = "flex";
                    toggleBtn.innerHTML = `⬆ Thu gọn bớt`;
                } else {
                    hiddenContainer.style.display = "none";
                    toggleBtn.innerHTML = `⬇ Xem thêm ${hiddenLinks.length} bài cũ hơn...`;
                }
            };

            containerElement.appendChild(toggleBtn);
            containerElement.appendChild(hiddenContainer);
        }
    }

                container.appendChild(newsCard);
            }
        });
    }
